apis:
- name: Replicant Outbound API
  description: >-
    Places outbound AI voice calls and SMS messages through Replicant against a pre-configured
    campaign, and notifies the caller of call status. Two POST operations — placeCall and
    sendSMS — each taking an E.164 phone number plus a free-form data object that becomes the
    context handed to the Replicant AI agent for the conversation, and each returning an
    identifier (callId / messageId) the outcome is correlated on. Authentication is a JWT bearer
    token; campaigns are provisioned outside the API. OpenAPI 3.0.0, version 2.0.1, published by
    Replicant at docs.replicant.ai and verified live on api.replicant.ai on 2026-08-14.
  humanURL: https://docs.replicant.ai/campaigns/
  baseURL: https://api.replicant.ai/api/v2
